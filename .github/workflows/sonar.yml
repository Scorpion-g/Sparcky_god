name: SonarQube Analysis

on:
  push:
    branches:
      - main

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Installe Java (modifie selon ton projet)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      # Analyse SonarQube
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=Scorpion-g_Sparcky_god
            -Dsonar.organization=ton_organisation_sonarqube
            -Dsonar.host.url=https://ton-instance-sonarqube.com
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
